function normalizeState(raw){let obj=cloneDefault();if(raw&&typeof raw==='object'){obj.settings={...obj.settings,...(raw.settings||{})};obj.sessions=Array.isArray(raw.sessions)?raw.sessions.filter(s=>s&&typeof s==='object'&&isWorkoutType(s.type)).map(s=>({id:String(s.id||id()),date:String(s.date||todayISO()),type:s.type,notes:String(s.notes||''),exercises:Array.isArray(s.exercises)?s.exercises.map(x=>({id:String(x.id||''),name:String(x.name||''),sets:safeNumber(x.sets),reps:safeNumber(x.reps),kg:safeNumber(x.kg),rir:safeNumber(x.rir,2)})):[]})):[];obj.weights=Array.isArray(raw.weights)?raw.weights.filter(w=>w&&Number.isFinite(Number(w.lb))).map(w=>({id:String(w.id||id()),date:String(w.date||todayISO()),lb:Number(w.lb)})):[];obj.updatedAt=String(raw.updatedAt||'')}obj.settings.frequency=Number(obj.settings.frequency)===3?3:4;return obj}
function save(){state.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('saveStatus').textContent='Guardado local';document.getElementById('saveStatus').className='pill live'}catch(e){document.getElementById('saveStatus').textContent='Exporta tu copia';document.getElementById('saveStatus').className='pill warn'} }
function id(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7)}
function toast(message,error=false){const el=document.getElementById('toast');el.textContent=message;el.className='toast show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.className='toast',3800)}
function sessionsSorted(){return [...state.sessions].sort((a,b)=>b.date.localeCompare(a.date))}
function benchEstimate(ex){if(!['benchSingle','benchHeavy','benchVolume'].includes(ex.id))return null;const reps=safeNumber(ex.reps),kg=safeNumber(ex.kg);if(kg<=0||reps<1||reps>10||safeNumber(ex.sets)<1)return null;return reps===1?kg:kg*(1+reps/30)}
function sessionBenchEstimate(s){return Math.max(0,...s.exercises.map(x=>benchEstimate(x)||0))}
function bench1rm(){const scores=state.sessions.filter(s=>dateObj(s.date)>=new Date(Date.now()-120*86400000)).map(sessionBenchEstimate).filter(Boolean);return Math.max(safeNumber(state.settings.current1rm,92.7),...scores)}
function currentBodyweight(){let a=[...state.weights].sort((x,y)=>y.date.localeCompare(x.date));return a.length?a[0].lb:Number(state.settings.bodyWeight)}
function goalPercent(){const a=state.settings.base1rm,b=state.settings.goal;return b>a?Math.max(0,Math.min(100,(bench1rm()-a)/(b-a)*100)):0}
function weekStart(d){let obj=dateObj(d),day=obj.getDay(),diff=(day+6)%7;obj.setDate(obj.getDate()-diff);return isoLocal(obj)}
function isoLocal(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function weekSessions(day=todayISO()){const start=weekStart(day),end=dateObj(start);end.setDate(end.getDate()+7);const e=isoLocal(end);return state.sessions.filter(s=>s.date>=start&&s.date<e)}
function scheduledTypes(){return state.settings.frequency===3?['legA','torsoA','legB']:['legA','torsoA','legB','torsoB']}
function benchPrescriptions(date=sessionDate){const start=dateObj(state.settings.startDate),now=dateObj(date);const weeks=Math.max(0,Math.floor((now-start)/604800000));const w=weeks%4;let plan=[{single:.85,heavy:.755,vol:.65,heavyReps:'4×5',volReps:'4×8'},{single:.865,heavy:.78,vol:.675,heavyReps:'4×5',volReps:'4×8'},{single:.885,heavy:.81,vol:.70,heavyReps:'4×4',volReps:'4×7'},{single:0,heavy:.66,vol:.61,heavyReps:'2×5',volReps:'2×6'}][w];return {...plan,week:w+1,block:Math.floor(weeks/4)+1,deload:w===3}}
function routineFor(t,frequency=state.settings.frequency){let list=EXERCISES[t].map(x=>[...x]);if(t==='legB'&&frequency===3)list.unshift([...EXERCISES.torsoB[0]]);return list}
function preferredWeight(exid,date=sessionDate){let p=benchPrescriptions(date),e1=bench1rm();if(exid==='benchSingle')return p.deload?0:roundPlate(e1*p.single);if(exid==='benchHeavy')return roundPlate(e1*p.heavy);if(exid==='benchVolume')return roundPlate(e1*p.vol);return ''}
function defaultReps(txt){const n=String(txt).match(/\d+/);return n?Number(n[0]):0}
function plannedSetsReps(exid,date=sessionDate){let p=benchPrescriptions(date);if(exid==='benchSingle')return p.deload?{sets:0,reps:0}:{sets:1,reps:1};if(exid==='benchHeavy')return p.deload?{sets:2,reps:5}:{sets:4,reps:p.week===3?4:5};if(exid==='benchVolume')return p.deload?{sets:2,reps:6}:{sets:4,reps:p.week===3?7:8};return null}
function nav(){const codes=['dashboard','train','history','routine','settings'];let mk=k=>`<button class="nav-item ${page===k?'active':''}" data-nav="${k}"><span class="nav-icon" aria-hidden="true">${PAGE_NAMES[k][2]}</span><span>${PAGE_NAMES[k][0]}</span></button>`;document.getElementById('desktopNav').innerHTML=codes.map(mk).join('');document.getElementById('mobileNav').innerHTML=codes.map(k=>`<button class="${page===k?'active':''}" data-nav="${k}"><span class="nav-icon" aria-hidden="true">${PAGE_NAMES[k][2]}</span><span>${PAGE_NAMES[k][0]}</span></button>`).join('');document.getElementById('pageTitle').textContent=PAGE_NAMES[page][1];document.getElementById('todayLabel').textContent=new Date().toLocaleDateString('es-DO',{day:'numeric',month:'short',year:'numeric'});document.getElementById('sideProgress').style.width=goalPercent()+'%'}
function show(k){page=k;nav();let view=document.getElementById('view');view.innerHTML=({dashboard:renderDashboard,train:renderTrain,history:renderHistory,routine:renderRoutine,settings:renderSettings}[k])();window.scrollTo({top:0,behavior:'smooth'});if(k==='train')populateForm()}
function benchRecords(){let series=new Map();for(const s of state.sessions){const v=sessionBenchEstimate(s);if(v>0)series.set(s.date,Math.max(series.get(s.date)||0,v))}let ar=[{date:state.settings.startDate,kg:Number(state.settings.base1rm),kind:'inicio'},...[...series].map(([date,kg])=>({date,kg,kind:'registro'}))];return ar.sort((a,b)=>a.date.localeCompare(b.date))}
function svgLineChart(records,mode='bench'){
 const isBench=mode==='bench';let arr=records.map(r=>({date:r.date,value:r.kg??r.lb})).filter(x=>Number.isFinite(x.value));if(!arr.length)return '<div class="empty"><div class="empty-icon">📈</div><strong>Sin datos aún</strong>Registra una sesión o peso para ver tu curva.</div>';
 let goalDate=state.settings.goalDate;let targets=isBench?[{date:state.settings.startDate,value:state.settings.base1rm},...MILESTONES.map(m=>({date:m[0],value:m[1]}))].filter(x=>x.date<=goalDate):[];
 let all=[...arr,...targets],earliest=Math.min(...all.map(p=>dateObj(p.date).getTime())),latest=Math.max(...all.map(p=>dateObj(p.date).getTime()),dateObj(todayISO()).getTime());if(earliest===latest)latest=earliest+86400000;
 let values=all.map(x=>x.value),min=Math.min(...values),max=Math.max(...values),padding=Math.max((max-min)*.16,isBench?6:3);min=Math.floor((min-padding)/5)*5;max=Math.ceil((max+padding)/5)*5;let W=750,H=280,L=45,R=18,T=12,B=38,w=W-L-R,h=H-T-B;
 const xp=x=>L+(dateObj(x).getTime()-earliest)/(latest-earliest)*w,yp=y=>T+h-(y-min)/(max-min)*h;
 const pts=entries=>entries.map(x=>[xp(x.date),yp(x.value)]),line=entries=>pts(entries).map((p,i)=>(i?'L':'M')+p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');
 let grid='';for(let i=0;i<=4;i++){const y=T+i*h/4;grid+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#344252" stroke-dasharray="3 6"/><text x="${L-9}" y="${y+4}" fill="#8195a7" font-size="11" text-anchor="end">${fmt(max-i*(max-min)/4,0)}</text>`}
 for(let i=0;i<=4;i++){let date=new Date(earliest+(latest-earliest)*i/4),x=L+i*w/4;grid+=`<text x="${x}" y="${H-7}" font-size="11" fill="#8195a7" text-anchor="middle">${date.toLocaleDateString('es-DO',{month:'short',year:'2-digit'})}</text>`}
 let path='';if(targets.length>1)path+=`<path d="${line(targets)}" stroke="#8291a5" stroke-width="2" stroke-dasharray="6 7" fill="none" opacity=".8"/>`;
 if(arr.length>1)path+=`<path d="${line(arr)}" stroke="${isBench?'#c5f28c':mode==='exercise'?'#72b9ff':'#78dcc2'}" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
 let circles=arr.map(p=>`<circle cx="${xp(p.date)}" cy="${yp(p.value)}" r="5" fill="${isBench?'#c5f28c':mode==='exercise'?'#72b9ff':'#78dcc2'}" stroke="#14202a" stroke-width="2"><title>${escapeHTML(formatDate(p.date))}: ${fmt(p.value,1)} ${isBench||mode==='exercise'?'kg':'lb'}</title></circle>`).join('');
 return `<svg class="panel-chart" role="img" aria-label="Evolución ${isBench?'del press de banca y proyección objetivo':mode==='exercise'?'de cargas en el ejercicio seleccionado':'del peso corporal'}" viewBox="0 0 ${W} ${H}">${grid}${path}${circles}</svg><div class="chart-legend"><span><i class="legend-dot" style="background:${isBench?'var(--lime)':mode==='exercise'?'var(--blue)':'var(--mint)'}"></i>Registros${isBench?' (1RM estimado)':''}</span>${isBench?'<span><i class="legend-dot" style="background:#8291a5"></i>Ruta objetivo · no garantizada</span>':''}</div>`
}
function exerciseRecords(exid){let m=new Map();for(const s of state.sessions){for(const x of s.exercises){if(x.id===exid&&x.kg>0&&x.sets>0)m.set(s.date,Math.max(m.get(s.date)||0,x.kg))}}return [...m].map(([date,kg])=>({date,kg})).sort((a,b)=>a.date.localeCompare(b.date))}
function renderDashboard(){let b=bench1rm(),remaining=Math.max(0,state.settings.goal-b),pct=goalPercent(),week=weekSessions(),types=scheduledTypes(),bw=currentBodyweight(),plan=benchPrescriptions(todayISO());let legs=['legA','legB'].filter(t=>week.some(s=>s.type===t)).length,unique=types.filter(t=>week.some(s=>s.type===t)).length;let weights=state.weights.length?[{date:state.settings.startDate,lb:Number(state.settings.bodyWeight)},...state.weights.map(w=>({date:w.date,lb:w.lb}))].sort((a,b)=>a.date.localeCompare(b.date)):[];
 return `<section class="hero"><div><div class="eyebrow">OBJETIVO · DICIEMBRE 2027</div><h2>CAMINO A<br><span>${fmt(state.settings.goal,0)} KG.</span></h2><p>Un registro a la vez. Fuerza en banca, piernas que progresan y una rutina que sí puedes sostener.</p><div class="hero-foot"><button class="btn" data-nav="train">＋ Registrar entrenamiento</button><button class="btn secondary" data-action="download-html">↓ Guardar HTML actualizado</button></div></div><div><div class="hero-pie" style="--progress:${pct}%"><div class="pie-center"><strong>${fmt(pct,0)}%</strong><small>del recorrido<br>completado</small></div></div></div></section>

 <section class="layout-2"><div class="panel"><div class="panel-head"><div><h3>Curva de fuerza · banca</h3><p>Estimación Epley a partir de series de 1 a 10 repeticiones</p></div><span class="tag">1RM</span></div>${svgLineChart(benchRecords())}<div class="note" style="margin-top:15px">Un 1RM estimado no es igual a un intento real. Usa el dato como tendencia; actualiza tu máximo confirmado en Ajustes cuando corresponda.</div></div>
 <div class="panel"><div class="panel-head"><div><h3>Semana actual</h3><p>${formatDate(weekStart(todayISO()))} · ${unique}/${types.length} sesiones planificadas</p></div><span class="tag">${state.settings.frequency} DÍAS</span></div><div class="weekly-list">${types.map(t=>{let found=week.filter(s=>s.type===t);return `<div class="weekly-row ${found.length?'done':''}"><div class="week-icon">${found.length?'✓':DAYS[t].icon}</div><div><div class="wtitle">${DAYS[t].name}</div><div class="wsub">${DAYS[t].sub}</div></div><div class="wstatus">${found.length?'Completado':'Pendiente'}</div></div>`}).join('')}</div><div class="metric-line"><span>Adherencia semanal</span><span>${Math.round(unique/types.length*100)}%</span></div><div class="bar"><div style="width:${unique/types.length*100}%"></div></div><p class="hint">En semanas de 3 días, la banca de volumen va primero en Pierna B.</p></div></section>
 <section class="layout-2"><div class="panel"><div class="panel-head"><div><h3>Tu bloque de entrenamiento</h3><p>Bloque ${plan.block} · Semana ${plan.week} de 4${plan.deload?' · DESCARGA':''}</p></div><button class="btn small secondary" data-nav="routine">Ver rutina</button></div><div class="targets"><div class="target-box"><span>Banca pesada</span><strong>${fmt(roundPlate(b*plan.heavy),1)} kg</strong><small>${plan.heavyReps}</small></div><div class="target-box"><span>Banca volumen</span><strong>${fmt(roundPlate(b*plan.vol),1)} kg</strong><small>${plan.volReps}</small></div><div class="target-box"><span>Single técnica</span><strong>${plan.deload?'—':fmt(roundPlate(b*plan.single),1)+' kg'}</strong><small>${plan.deload?'Sin single':'1×1 · sin máximo'}</small></div><div class="target-box"><span>Siguiente descarga</span><strong>${plan.deload?'Ahora':`Sem. 4`}</strong><small>Control de fatiga</small></div></div></div>
 <div class="panel"><div class="panel-head"><div><h3>Últimos entrenamientos</h3><p>Tu historial reciente</p></div><button class="btn small secondary" data-nav="history">Ver todos</button></div>${sessionsSorted().length?sessionsSorted().slice(0,4).map(s=>`<div class="milestone"><div class="milestone-dot" style="background:var(--lime);border-color:var(--lime)"></div><div class="milestone-info"><strong>${DAYS[s.type].name}</strong><p>${formatDate(s.date)} · ${s.exercises.filter(x=>x.sets>0).length} ejercicios</p></div>${sessionBenchEstimate(s)?`<div class="milestone-kg">≈ ${fmt(sessionBenchEstimate(s),1)} kg</div>`:''}</div>`).join(''):'<div class="empty"><div class="empty-icon">📋</div><strong>Todo empieza con una sesión</strong>Registra tu primer entrenamiento para ver avances.</div>'}</div></section>
 <section class="layout-2"><div class="panel"><div class="panel-head"><div><h3>Fuerza en piernas</h3><p>Carga de trabajo por ejercicio, en kg</p></div><select id="legChartChoice" aria-label="Elegir ejercicio de piernas" style="width:auto;max-width:185px">${LEG_CHART_IDS.map(([id,label])=>`<option value="${id}" ${legChartChoice===id?'selected':''}>${label}</option>`).join('')}</select></div><div id="legChart">${svgLineChart(exerciseRecords(legChartChoice),'exercise')}</div><p class="hint">La carga refleja el peso anotado, no la fuerza máxima. Compara pesos solo cuando la técnica y las repeticiones sean similares.</p></div><div class="panel"><div class="panel-head"><div><h3>Peso corporal</h3><p>Mediciones en libras</p></div><button class="btn small secondary" data-nav="history">Registrar peso</button></div>${weights.length?svgLineChart(weights,'weight'):'<div class="empty"><div class="empty-icon">⚖️</div><strong>Sin pesajes todavía</strong>Registra tu peso corporal desde Historial.</div>'}</div><div class="panel"><div class="panel-head"><div><h3>Hitos de fuerza</h3><p>Ruta aspiracional hacia diciembre 2027</p></div></div>${[100,110,120,130,140].map(v=>`<div class="milestone ${b>=v?'reached':''}"><div class="milestone-dot"></div><div class="milestone-info"><strong>${b>=v?'Alcanzado':'Próximo nivel'}</strong><p>${v===110?'Recuperar récord histórico':v===140?'Objetivo final':'Hito intermedio'}</p></div><div class="milestone-kg">${v} kg</div></div>`).join('')}</div></section>`}

 <section class="panel"><div class="panel-head"><div><h3>${DAYS[selectedDay].name} · ejercicios</h3><p>Marca «Hecho» en cada ejercicio realizado; solo se guardarán los que hayas completado. Deja el peso vacío si no aplica.</p></div><button class="btn small secondary" data-action="previous">↻ Usar cargas previas</button></div><div id="exerciseList" class="exercise-list"></div><div class="hr"></div><div class="form-field"><label for="sessionNotes">Notas de la sesión (opcional)</label><textarea id="sessionNotes" placeholder="Sensaciones, molestias, técnica, recuperación..."></textarea></div><div class="btn-row" style="margin-top:17px"><button class="btn" id="saveSession">✓ ${editId?'Actualizar sesión':'Guardar sesión'}</button>${editId?'<button class="btn ghost" data-action="cancel-edit">Cancelar edición</button>':''}</div><p class="hint">Los pesos sugeridos para banca se redondean a 2.5 kg. Redúcelos si no conservas el RIR previsto.</p></section>`}

function saveSession(){let exercises=collectForm();if(!sessionDate||!/^\d{4}-\d{2}-\d{2}$/.test(sessionDate))return toast('Selecciona una fecha válida.',true);if(!exercises.some(x=>x.sets>0&&x.reps>0))return toast('Marca Hecho en los ejercicios completados.',true);let notes=document.getElementById('sessionNotes').value.trim();const item={id:editId||id(),date:sessionDate,type:selectedDay,exercises,notes};if(editId){let index=state.sessions.findIndex(s=>s.id===editId);if(index>=0)state.sessions[index]=item;else state.sessions.push(item)}else state.sessions.push(item);save();toast('Sesión guardada correctamente.');editId=null;show('dashboard')}
function renderHistory(){let list=sessionsSorted().filter(s=>historyFilter==='all'||s.type===historyFilter);return `<section class="panel"><div class="panel-head"><div><h3>Registrar peso corporal</h3><p>Ingresa mediciones reales en libras (lb).</p></div><span class="tag">PESO CORPORAL</span></div><div class="form-bar"><div class="form-field"><label for="weightDate">Fecha</label><input id="weightDate" type="date" value="${todayISO()}"></div><div class="form-field"><label for="weightValue">Peso (lb)</label><input id="weightValue" type="number" min="40" max="700" step="0.1" placeholder="188"></div><button class="btn" id="saveWeight">＋ Registrar peso</button></div>${state.weights.length?`<div class="hr"></div><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Peso</th><th></th></tr></thead><tbody>${[...state.weights].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8).map(w=>`<tr><td>${formatDate(w.date)}</td><td><strong>${fmt(w.lb,1)} lb</strong></td><td style="text-align:right"><button class="btn small ghost" data-del-weight="${escapeHTML(w.id)}">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`:''}</section>
 <section class="panel"><div class="panel-head"><div><h3>Sesiones registradas</h3><p>${state.sessions.length} entrenamientos guardados · edita o elimina cuando lo necesites.</p></div><select id="historyFilter" aria-label="Filtrar sesiones" style="width:auto"><option value="all">Todos los días</option>${Object.entries(DAYS).map(([t,d])=>`<option value="${t}" ${historyFilter===t?'selected':''}>${d.name}</option>`).join('')}</select></div>${list.length?list.map(s=>`<article class="history-item"><div class="history-top"><span style="font-size:22px">${DAYS[s.type].icon}</span><div><div class="record-title">${DAYS[s.type].name}</div><p>${formatDate(s.date)} · ${s.exercises.filter(x=>x.sets>0).length} ejercicios${sessionBenchEstimate(s)?' · banca ≈ '+fmt(sessionBenchEstimate(s),1)+' kg 1RM':''}</p></div><div class="right"><button class="btn small secondary" data-edit="${escapeHTML(s.id)}">Editar</button><button class="btn small danger" data-del-session="${escapeHTML(s.id)}">Eliminar</button></div></div><div class="history-body"><div class="tablewrap"><table><thead><tr><th>Ejercicio</th><th>Series</th><th>Reps</th><th>Kg</th><th>RIR</th></tr></thead><tbody>${s.exercises.filter(x=>x.sets>0).map(x=>`<tr><td>${escapeHTML(x.name)}</td><td>${fmt(x.sets,0)}</td><td>${fmt(x.reps,0)}</td><td>${x.kg?fmt(x.kg,2):'—'}</td><td>${fmt(x.rir,0)}</td></tr>`).join('')}</tbody></table></div>${s.notes?`<p class="hint"><strong>Nota:</strong> ${escapeHTML(s.notes)}</p>`:''}</div></article>`).join(''):'<div class="empty"><div class="empty-icon">🗂️</div><strong>No hay sesiones en este filtro</strong>Vuelve al registro para añadir entrenamientos.</div>'}</section>`}
function renderRoutine(){let p=benchPrescriptions(todayISO()),b=bench1rm(),start=formatDate(state.settings.startDate);return `<section class="panel"><div class="panel-head"><div><h3>Plan de entrenamiento</h3><p>Torso–pierna · 3–4 días semanales · fuerza e hipertrofia</p></div><span class="tag">2 DÍAS DE PIERNA</span></div><div class="note">En <strong>4 días</strong>: Pierna A · Torso A · Pierna B · Torso B. En <strong>3 días</strong>: Pierna A · Torso A · Pierna B, añadiendo banca de volumen <strong>al inicio</strong> de Pierna B. Deja al menos un día de recuperación entre las dos exposiciones de banca cuando puedas.</div><div class="hr"></div><div class="panel-head"><h3>Tu semana activa</h3><span class="pill">Semana ${p.week}/4 · Bloque ${p.block}</span></div><div class="targets"><div class="target-box"><span>Banca pesada</span><strong>${fmt(roundPlate(b*p.heavy),1)} kg</strong><small>${p.heavyReps}</small></div><div class="target-box"><span>Banca volumen</span><strong>${fmt(roundPlate(b*p.vol),1)} kg</strong><small>${p.volReps}</small></div><div class="target-box"><span>Single de práctica</span><strong>${p.deload?'—':fmt(roundPlate(b*p.single),1)+' kg'}</strong><small>${p.deload?'Omitida en descarga':'RPE 7–8, técnica perfecta'}</small></div><div class="target-box"><span>Recuperación</span><strong>${p.deload?'Descarga':'RIR 2–3'}</strong><small>Sin fallos en compuestos</small></div></div></section>
 ${scheduledTypes().map((t,i)=>`<section class="panel"><div class="panel-head"><div><div class="ribbon">DÍA ${i+1}</div><h3 style="margin-top:5px">${DAYS[t].icon} ${DAYS[t].name}</h3><p>${DAYS[t].sub}</p></div><button class="btn small secondary" data-start-day="${t}">Registrar este día</button></div><div class="tablewrap"><table><thead><tr><th>Ejercicio</th><th>Series</th><th>Repeticiones</th><th>RIR</th></tr></thead><tbody>${routineFor(t).map(x=>`<tr><td>${escapeHTML(x[1])}</td><td>${x[2]}</td><td>${escapeHTML(x[3])}</td><td>${x[4]}</td></tr>`).join('')}</tbody></table></div></section>`).join('')}
 <section class="panel"><div class="panel-head"><h3>Ondulación del bloque de 4 semanas</h3></div><div class="tablewrap"><table><thead><tr><th>Semana</th><th>Single</th><th>Fuerza</th><th>Volumen</th></tr></thead><tbody><tr><td>1</td><td>≈85% ×1</td><td>4×5 · ≈75%</td><td>4×8 · 65%</td></tr><tr><td>2</td><td>≈86.5% ×1</td><td>4×5 · ≈78%</td><td>4×8 · 67.5%</td></tr><tr><td>3</td><td>≈88.5% ×1</td><td>4×4 · ≈81%</td><td>4×7 · 70%</td></tr><tr><td>4</td><td>Sin single</td><td>2×5 · ≈66%</td><td>2×6 · ≈61%</td></tr></tbody></table></div><p class="hint">Porcentajes orientativos sobre el 1RM de referencia; no aumentes cargas si tu técnica o RIR no acompañan. En los ejercicios accesorios, aumenta el peso cuando completes el extremo alto del rango en todas las series.</p></section>`}
function renderSettings(){let s=state.settings;return `<section class="panel"><div class="panel-head"><div><h3>📲 Mi aplicación instalada</h3><p>Acceso directo en iPhone, Android y PC</p></div><span class="tag">PWA</span></div><div class="note" style="margin-bottom:12px"><strong>iPhone:</strong> abre la URL de tu proyecto en <strong>Safari</strong> → Compartir → <strong>Añadir a pantalla de inicio</strong> → activa <strong>Abrir como app web</strong> → Añadir. Después ábrela con internet una vez para preparar el modo offline.</div><div class="note"><strong>Importante:</strong> tus registros se guardan en este navegador/dispositivo; instalar la app no importa automáticamente los del HTML antiguo. Para migrar: <strong>Exportar JSON</strong> en la versión anterior y <strong>Importar JSON</strong> aquí. No publiques respaldos ni archivos HTML con tus entrenamientos en GitHub.</div></section><section class="panel"><div class="panel-head"><div><h3>Mis objetivos y configuración</h3><p>Puedes modificar tus valores conforme avances.</p></div></div><div class="two-fields"><div class="form-field"><label for="setGoal">Objetivo banca (kg)</label><input id="setGoal" type="number" min="50" max="400" step="0.5" value="${s.goal}"></div><div class="form-field"><label for="setGoalDate">Fecha de meta</label><input id="setGoalDate" type="date" value="${escapeHTML(s.goalDate)}"></div><div class="form-field"><label for="setBase">1RM al inicio del proyecto (kg)</label><input id="setBase" type="number" min="1" max="400" step="0.1" value="${s.base1rm}"></div><div class="form-field"><label for="setCurrent">1RM actual confirmado (kg)</label><input id="setCurrent" type="number" min="1" max="400" step="0.1" value="${s.current1rm}"></div><div class="form-field"><label for="setHistoric">PR histórico de banca (kg)</label><input id="setHistoric" type="number" min="1" max="400" step="0.1" value="${s.historicPR}"></div><div class="form-field"><label for="setBW">Peso corporal inicial (lb)</label><input id="setBW" type="number" min="30" max="700" step="0.1" value="${s.bodyWeight}"></div><div class="form-field"><label for="setStart">Inicio del programa</label><input id="setStart" type="date" value="${escapeHTML(s.startDate)}"></div><div class="form-field"><label for="setFreq">Sesiones por semana</label><select id="setFreq"><option value="4" ${s.frequency===4?'selected':''}>4 días: rutina completa</option><option value="3" ${s.frequency===3?'selected':''}>3 días: banca volumen + Pierna B</option></select></div></div><div class="btn-row" style="margin-top:16px"><button class="btn" id="saveSettings">✓ Guardar ajustes</button></div><p class="hint">El 1RM mostrado es el mayor entre tu valor confirmado actual y las estimaciones de banca de los últimos 120 días. Si una serie de 8 reps se registra, se estima su máximo con la fórmula de Epley; no es una marca confirmada.</p></section>
 <section class="panel"><div class="panel-head"><div><h3>Mis datos y copias de seguridad</h3><p>No necesitas cuenta, conexión ni servidor.</p></div><span class="tag">OFFLINE</span></div><div class="backup-grid"><div class="backup-card"><div><strong>💾 Guardar HTML actualizado</strong><p>Descarga otra copia de esta misma app con todos los entrenamientos y pesajes <strong>incluidos dentro del archivo</strong>. Ideal para mover de celular a PC.</p></div><button class="btn" data-action="download-html">↓ Descargar HTML con datos</button></div><div class="backup-card"><div><strong>📦 Exportar JSON</strong><p>Respaldo compacto para restaurar todo tu historial en otra copia del panel.</p></div><button class="btn secondary" data-action="export-json">↓ Exportar copia JSON</button></div><div class="backup-card"><div><strong>📊 Exportar CSV</strong><p>Abre tu historial de ejercicios y de peso corporal en Excel o Google Sheets.</p></div><button class="btn secondary" data-action="export-csv">↓ Descargar CSV</button></div><div class="backup-card"><div><strong>📂 Importar JSON</strong><p>Restaura tus datos desde un respaldo anterior. Reemplaza la información local existente.</p></div><button class="btn secondary" data-action="import-json">↑ Importar respaldo</button></div></div><div class="note warn" style="margin-top:15px"><strong>Cómo conservar tus datos:</strong> esta aplicación instalada guarda entrenamientos en el almacenamiento <strong>de este dispositivo</strong>; no se sincronizan automáticamente con otros equipos. Exporta una copia JSON con regularidad. Si vienes del antiguo archivo HTML, ábrelo, exporta su JSON y luego impórtalo aquí. Para usarla sin internet, ábrela una vez con conexión después de instalarla.</div></section>
 <section class="panel"><div class="panel-head"><div><h3>Restablecer registros</h3><p>Solo si quieres empezar de cero.</p></div></div><button class="btn danger" data-action="reset">Eliminar todos los registros</button><p class="hint">Se borrarán sesiones y pesajes de esta copia. Descarga un respaldo antes si quieres conservarlos.</p></section>`}
function download(name,mime,content){let url=URL.createObjectURL(new Blob([content],{type:mime}));let a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportJSON(){download('Proyecto_140KG_respaldo_'+todayISO()+'.json','application/json;charset=utf-8',JSON.stringify(state,null,2));toast('Respaldo JSON descargado.')}
function toBase64(str){let bytes=new TextEncoder().encode(str),result='';for(let i=0;i<bytes.length;i+=8192)result+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(result)}
function exportHTML(){try{let clone=document.documentElement.cloneNode(true);clone.querySelector('#seed-data').textContent=toBase64(JSON.stringify(state));clone.querySelector('#view').innerHTML='';clone.querySelector('#desktopNav').innerHTML='';clone.querySelector('#mobileNav').innerHTML='';clone.querySelector('#importFile').value='';clone.querySelectorAll('[data-pwa-only]').forEach(x=>x.remove());let html='<!DOCTYPE html>\n'+clone.outerHTML;download('Proyecto_140KG_actualizado_'+todayISO()+'.html','text/html;charset=utf-8',html);toast('HTML actualizado descargado con tus datos.')}catch(e){toast('No se pudo generar el HTML: '+e.message,true)}}
function csvCell(x){let str=String(x??'');return /[,"\r\n;]/.test(str)?'"'+str.replace(/"/g,'""')+'"':str}
function exportCSV(){const cols=['Fecha','Sesion','Ejercicio','Series','Repeticiones','Kilogramos','RIR','Notas'];let ar=[cols.join(',')];for(const s of sessionsSorted()){for(const x of s.exercises.filter(x=>x.sets>0)){ar.push([s.date,DAYS[s.type].name,x.name,x.sets,x.reps,x.kg,x.rir,s.notes].map(csvCell).join(','))}}download('Proyecto_140KG_entrenamientos_'+todayISO()+'.csv','text/csv;charset=utf-8','\ufeff'+ar.join('\r\n'));let bw=[['Fecha','Peso_lb'],...state.weights.map(w=>[w.date,w.lb])].map(row=>row.map(csvCell).join(','));download('Proyecto_140KG_peso_'+todayISO()+'.csv','text/csv;charset=utf-8','\ufeff'+bw.join('\r\n'));toast('Se descargaron dos archivos CSV.')}
function saveSettings(){let read=(id)=>document.getElementById(id).value;let newSettings={goal:+read('setGoal'),goalDate:read('setGoalDate'),base1rm:+read('setBase'),current1rm:+read('setCurrent'),historicPR:+read('setHistoric'),bodyWeight:+read('setBW'),startDate:read('setStart'),frequency:+read('setFreq')};if([newSettings.goal,newSettings.base1rm,newSettings.current1rm,newSettings.historicPR,newSettings.bodyWeight].some(x=>!Number.isFinite(x)||x<=0)||newSettings.goal<=newSettings.base1rm)return toast('Revisa los valores numéricos de tus objetivos.',true);if(!newSettings.goalDate||!newSettings.startDate||newSettings.goalDate<newSettings.startDate)return toast('La fecha de meta debe ser posterior al inicio.',true);state.settings=newSettings;save();show('settings');toast('Ajustes guardados.');}
function saveWeight(){const el=document.getElementById('weightValue'),d=document.getElementById('weightDate').value,v=Number(el.value);if(!el.value||v<40||v>700||!d)return toast('Ingresa fecha y peso válido en lb.',true);state.weights.push({id:id(),date:d,lb:v});save();show('history');toast('Peso registrado.')}
function previousWeights(){let past=sessionsSorted().find(s=>s.type===selectedDay&&s.date<=sessionDate&&s.id!==editId);if(!past)return toast('Todavía no hay una sesión anterior de este tipo.',true);for(const row of document.querySelectorAll('.exercise')){let matched=past.exercises.find(x=>x.id===row.dataset.ex);if(matched){for(const key of ['sets','reps','kg','rir'])row.querySelector('[data-f="'+key+'"]').value=matched[key]}}toast('Cargas de la sesión anterior copiadas.')}
function editSession(idv){const s=state.sessions.find(x=>x.id===idv);if(!s)return;editId=idv;selectedDay=s.type;sessionDate=s.date;show('train')}
function deleteSession(idv){if(!confirm('¿Eliminar esta sesión? Esta acción no se puede deshacer.'))return;state.sessions=state.sessions.filter(s=>s.id!==idv);save();show('history');toast('Sesión eliminada.')}
function reset(){if(!confirm('¿Eliminar TODOS los entrenamientos y pesajes? Descarga un respaldo antes.'))return;if(!confirm('Confirmación final: se borrarán tus registros guardados aquí.'))return;state.sessions=[];state.weights=[];save();show('dashboard');toast('Registros eliminados.')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.nav){if(page==='train'&&b.dataset.nav!=='train')editId=null;show(b.dataset.nav);return}if(b.dataset.day){selectedDay=b.dataset.day;editId=null;show('train');return}if(b.dataset.startDay){selectedDay=b.dataset.startDay;editId=null;sessionDate=todayISO();show('train');return}if(b.dataset.edit){editSession(b.dataset.edit);return}if(b.dataset.delSession){deleteSession(b.dataset.delSession);return}if(b.dataset.delWeight){if(confirm('¿Eliminar esta medición de peso?')){state.weights=state.weights.filter(w=>w.id!==b.dataset.delWeight);save();show('history');toast('Pesaje eliminado.')}return}if(b.id==='saveSession')return saveSession();if(b.id==='saveWeight')return saveWeight();if(b.id==='saveSettings')return saveSettings();if(b.dataset.action){switch(b.dataset.action){case 'previous':return previousWeights();case 'cancel-edit':editId=null;return show('train');case 'download-html':return exportHTML();case 'export-json':return exportJSON();case 'export-csv':return exportCSV();case 'import-json':return document.getElementById('importFile').click();case 'reset':return reset()}}});
document.addEventListener('change',e=>{if(e.target.id==='sessionDate'){sessionDate=e.target.value;show('train')}if(e.target.id==='historyFilter'){historyFilter=e.target.value;show('history')}if(e.target.id==='legChartChoice'){legChartChoice=e.target.value;document.getElementById('legChart').innerHTML=svgLineChart(exerciseRecords(legChartChoice),'exercise')}if(e.target.matches('[data-f="done"]')){e.target.closest('.exercise').classList.toggle('checked',e.target.checked)}});
document.getElementById('importFile').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{let parsed=JSON.parse(await file.text());if(!parsed||!parsed.settings||!Array.isArray(parsed.sessions)||!Array.isArray(parsed.weights))throw Error('Formato de respaldo no reconocido.');if(!confirm('¿Restaurar este respaldo y reemplazar los registros actuales?'))return;state=normalizeState(parsed);save();show('dashboard');toast('Respaldo importado correctamente.')}catch(err){toast('No se pudo importar: '+err.message,true)}finally{e.target.value=''}});
state=getData();save();show('dashboard');
</script>
